services:
  habit-tracker:
    build: .
    image: habit-tracker:latest
    container_name: habit-tracker
    ports:
      # Host port defaults to 8080. If it's taken:  HOST_PORT=8081 docker compose up -d
      # 0.0.0.0 = reachable from your phone (Wi-Fi / Tailscale), not only from this computer.
      - "0.0.0.0:${HOST_PORT:-8080}:3000"
    environment:
      # Your time zone, used for reminder times, e.g. Asia/Kolkata, Europe/London, America/New_York.
      # Override without editing this file:  TZ=Asia/Kolkata docker compose up -d
      - TZ=${TZ:-UTC}
    volumes:
      - habit-data:/data
    restart: unless-stopped

volumes:
  habit-data:
